submission:
  title: "PortFlow AI - Container Congestion Predictor and Port Operations Optimiser"

  problem_statement: >
    Container-terminal shift supervisors coordinate vessel arrivals, berth
    availability, and crane capacity across fragmented spreadsheets, so
    congestion is often recognised only after queues and costly delays form.

  solution_summary: >
    PortFlow AI converts schedule and terminal-capacity data into a 72-hour
    congestion forecast and a constraint-aware berth-and-crane plan, with
    explainable recommendations and explicit supervisor approval.

  key_features:
    - "72-hour congestion-risk and vessel waiting-time prediction"
    - "Joint berth-and-crane optimisation with operational constraints"
    - "Before-and-after wait-time and utilisation comparison"
    - "Human-approved alternate-port and operations-plan workflow"
    - "IBM Bob task evidence and MCP-accessible operational explanations"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol"]
    databases: ["PostgreSQL"]
    other: ["OR-Tools CP-SAT", "scikit-learn", "GitHub Actions"]

  what_we_are_most_proud_of: >
    PortFlow AI links prediction to a feasible operational action, quantifies
    the expected improvement, and keeps consequential decisions under explicit
    human control.

  known_limitations: >
    The OR-Tools CP-SAT optimizer and IBM Bob MCP tools are not yet implemented;
    those pages show a static demo. All data is synthetic and reproducible (seed
    2026). The system targets one terminal and does not ingest live AIS feeds.
    PostgreSQL is optional; the app falls back to synthetic data without it.
    Demo video and live deployment pending.

