submission:
  title: "PortFlow AI - Container Congestion Predictor and Port Operations Optimiser"

  problem_statement: >
    Container-terminal shift supervisors coordinate vessel arrivals, berth
    availability, and crane capacity across fragmented spreadsheets, so
    congestion is often recognised only after queues and costly delays form.

  solution_summary: >
    PortFlow AI calculates a 72-hour baseline congestion view, simulates five
    operational scenarios, and serves trained ML congestion and waiting-time
    predictions. Static planning interfaces demonstrate the intended supervisor
    workflow; runtime optimisation and live Copilot integration are future work.

  key_features:
    - "Interactive 72-hour baseline congestion dashboard"
    - "Five reproducible operational scenario simulations"
    - "Trained ML vessel waiting-time and congestion predictions"
    - "API-backed schedules and berth/crane resources"
    - "Static demo of supervisor operations-plan review and confirmation"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob (development use reported by team; evidence pending)"]
    databases: ["PostgreSQL"]
    other: ["scikit-learn", "joblib", "NumPy", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The reproducible scenario dashboard and trained prediction endpoints produce
    actual outputs from synthetic inputs, with clear model and data disclosures.

  known_limitations: >
    The OR-Tools CP-SAT optimizer and IBM Bob MCP tools are not yet implemented;
    those pages show a static demo. All data is synthetic and reproducible (seed
    2026). The system targets one terminal and does not ingest live AIS feeds.
    PostgreSQL is optional; the app falls back to synthetic data without it.
    Demo video and live deployment pending.

